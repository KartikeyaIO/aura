[package]
name = "reel"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "reel"
path = "src/main.rs"

[dependencies]
zstd = "0.13"
crc32fast = "1.4"
bytemuck = { version = "1.16", features = ["derive"] }
thiserror = "2"
bincode = "1.3"
rayon = "1.8"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

